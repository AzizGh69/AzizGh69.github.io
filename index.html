<style>
:root{
  --ink:#040A1C;
  --navy:#0B1E57;
  --blue:#1749D1;
  --cyan:#4FE6FF;
  --ice:#D6F7FF;
  --muted:#A9BEEA;
  --amber:#FFC547;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --snap:cubic-bezier(.2,1.4,.35,1);
  --out:cubic-bezier(.16,1,.3,1);
  --slant:polygon(4% 0,100% 0,96% 100%,0 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:#fff;font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 95% at 88% 8%,#1C5CF0 0%,#0B1E57 42%,#040A1C 100%)}
.band{position:absolute;left:-25%;width:150%;transform:rotate(-14deg);background:linear-gradient(90deg,transparent 0%,rgba(79,230,255,.13) 45%,rgba(79,230,255,.04) 70%,transparent 100%);animation:drift 16s ease-in-out infinite alternate}
.band.b1{top:14%;height:20vh}
.band.b2{top:50%;height:8vh;animation-duration:22s;opacity:.8}
.band.b3{top:74%;height:3vh;animation-duration:12s}
.streak{position:absolute;left:-30%;width:160%;height:2px;transform:rotate(-14deg);background:linear-gradient(90deg,transparent,var(--cyan) 50%,transparent);opacity:.3}
.streak.s1{top:36%}.streak.s2{top:66%;opacity:.18}.streak.s3{top:88%;opacity:.25}
@keyframes drift{from{translate:-3% 0}to{translate:3% 0}}
.watermark{position:absolute;right:-3vw;bottom:-8vh;margin:0;font:900 italic 30vw/.8 var(--display);color:transparent;-webkit-text-stroke:2px rgba(214,247,255,.07);transform:rotate(-8deg);white-space:nowrap;user-select:none;pointer-events:none}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;padding:20px 32px;pointer-events:none}
.topbar>*{pointer-events:auto}
.clock{display:flex;flex-direction:column;gap:6px}
.clock-row{display:flex;align-items:stretch;filter:drop-shadow(6px 6px 0 rgba(23,73,209,.9))}
.clock-date{background:#fff;color:var(--ink);font:900 italic 50px/1 var(--display);padding:4px 24px 0 16px;clip-path:var(--slant)}
.clock-dow{background:var(--cyan);color:var(--ink);font:800 italic 22px/1 var(--display);padding:0 18px;display:flex;align-items:center;margin-left:-8px;clip-path:var(--slant);letter-spacing:.06em}
.clock-tod{font:800 italic 17px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);padding-left:10px}
.clock-day{font:600 italic 14px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--ice);padding-left:22px}
.quick{display:flex;gap:8px;align-items:center}
.chipbtn{all:unset;display:inline-block;cursor:pointer;font:800 italic 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:10px 18px 9px;background:rgba(4,10,28,.66);color:var(--ice);clip-path:var(--slant);transition:background .12s,color .12s}
.chipbtn:hover{background:rgba(23,73,209,.8);color:#fff}
.chipbtn[aria-pressed="true"],.chipbtn[aria-selected="true"]{background:#fff;color:var(--ink)}
.chipbtn.solid{background:var(--cyan);color:var(--ink)}
.chipbtn[hidden]{display:none}
.chipbtn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.chipbtn:focus-visible{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.chipbtn.snd{padding:6px 16px 5px;line-height:0}
.snd svg{display:block;width:30px;height:22px;overflow:visible}
.snd .cone{fill:currentColor}
.snd .wave,.snd .slash{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:square}
.snd .wave{transition:opacity .15s}
.snd .slash{transition:opacity .15s}
.snd[aria-pressed="false"] .wave{opacity:0}
.snd[aria-pressed="true"] .slash{opacity:0}
.snd[aria-pressed="true"] .w1{animation:beat 1.1s ease-in-out infinite}
.snd[aria-pressed="true"] .w2{animation:beat 1.1s .28s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
.chipbtn kbd{font:inherit;background:var(--cyan);color:var(--ink);padding:2px 6px;margin-right:6px}

/* ---------- screens ---------- */
main{position:relative;z-index:5;height:100%}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
/* Vertical scrollbars stay native but thin and in the palette rather than white. */
.screen,.qlist,.qdetail{scrollbar-width:thin;scrollbar-color:rgba(79,230,255,.5) transparent}
.screen[hidden]{display:none!important}

/* ---------- main menu ---------- */
#menu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-rows:minmax(0,1fr);padding:120px 4vw 80px;overflow:hidden}
.hero{position:relative;min-height:0}
.nameplate{position:relative;z-index:3;animation:rise .6s var(--out) both}
.np-plates{filter:drop-shadow(7px 7px 0 rgba(79,230,255,.6))}
.np-first,.np-last{display:block;width:max-content;max-width:100%;text-transform:uppercase;clip-path:var(--slant);margin:0}
.np-first{background:#fff;color:var(--ink);font:900 italic clamp(44px,min(5.2vw,8vh),84px)/.92 var(--display);padding:8px 34px 2px 18px}
.np-last{background:var(--blue);color:#fff;font:800 italic clamp(28px,min(3.2vw,5vh),50px)/.95 var(--display);padding:7px 26px 3px 18px;margin:6px 0 0 46px;letter-spacing:.04em}
.np-tag{margin:18px 0 0 92px;max-width:400px;font:600 16px/1.45 var(--body);color:var(--ice);text-shadow:0 2px 14px rgba(4,10,28,.9)}
.np-tag b{color:var(--cyan);font-weight:700}
.portrait{position:absolute;right:5vw;bottom:30px;width:min(19vw,29vh,330px);margin:0;z-index:2;rotate:-4deg;animation:rise .7s .08s var(--out) both}
.pframe{position:relative;aspect-ratio:4/5;--cut:polygon(12% 0,100% 0,88% 100%,0 100%);filter:drop-shadow(0 0 22px rgba(79,230,255,.28))}
.pframe .plate{position:absolute;inset:0;clip-path:var(--cut);transition:transform .35s var(--snap)}
.pframe .p1{background:var(--cyan);transform:translate(16px,12px)}
.pframe .p2{background:var(--blue);transform:translate(-12px,22px)}
.portrait:hover .p1{transform:translate(22px,16px)}
.portrait:hover .p2{transform:translate(-18px,28px)}
.pshot{display:block;position:relative;height:100%;clip-path:var(--cut)}
.pshot img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.82) contrast(1.06)}
.pshot::before{content:"";position:absolute;inset:0;z-index:1;background:rgba(23,73,209,.28);mix-blend-mode:color;pointer-events:none}
.pshot::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,transparent 52%,rgba(11,30,87,.5) 82%,rgba(4,10,28,.82));pointer-events:none}
.ripples{position:absolute;left:50%;bottom:-30px;width:150%;height:56px;transform:translateX(-50%);pointer-events:none;z-index:0}
.ripples span{position:absolute;inset:0;border:2px solid rgba(79,230,255,.55);border-radius:50%;animation:ripple 3.6s ease-out infinite;opacity:0}
.ripples span:nth-child(2){animation-delay:1.2s}
.ripples span:nth-child(3){animation-delay:2.4s}
@keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.15);opacity:0}}
@keyframes rise{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}

.menu{align-self:start;justify-self:end;position:relative;z-index:4;margin:1vh 3vw 0 0}
.menu ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;transform:rotate(-7deg);transform-origin:100% 50%}
.menu li{--x:calc(var(--i) * 20px);transform:translateX(var(--x));animation:slide .55s var(--snap) both;animation-delay:calc(120ms + var(--i) * 55ms)}
@keyframes slide{from{opacity:0;transform:translateX(calc(var(--x) + 140px))}to{opacity:1;transform:translateX(var(--x))}}
.menu button{all:unset;cursor:pointer;position:relative;display:flex;align-items:baseline;gap:14px;padding:4px 28px 0 20px;-webkit-tap-highlight-color:transparent}
.menu button::before{content:"";position:absolute;left:-10px;right:-8px;top:10%;bottom:4%;background:var(--cyan);clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);transform:scaleX(0);transform-origin:0 50%;transition:transform .2s var(--snap)}
.menu button::after{content:"";position:absolute;left:-54px;top:50%;width:30px;height:32px;margin-top:-16px;background:#fff;clip-path:polygon(0 0,100% 50%,0 100%);opacity:0;transform:translateX(-12px);transition:opacity .15s,transform .2s var(--snap)}
.menu .label{position:relative;font:900 italic clamp(38px,min(5.3vw,8.4vh),84px)/.9 var(--display);text-transform:uppercase;text-shadow:4px 4px 0 rgba(4,10,28,.6);transition:transform .22s var(--snap),color .12s}
.menu .sub{position:relative;font:800 italic 14px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:color .12s,transform .22s var(--snap)}
.menu li.sel button::before{transform:scaleX(1)}
.menu li.sel button::after{opacity:1;transform:none;animation:nudge .7s ease-in-out .2s infinite alternate}
.menu li.sel .label{color:var(--ink);transform:translateX(12px) scale(1.05);text-shadow:5px 5px 0 #fff}
.menu li.sel .sub{color:var(--ink);transform:translateX(22px)}
.menu button:focus-visible .sub{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
@keyframes nudge{to{transform:translateX(-8px)}}

.status{position:absolute;right:3vw;bottom:64px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:8px;width:min(380px,32vw);animation:rise .6s .35s var(--out) both}
.card{width:100%;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:3px 12px;padding:10px 30px 12px 24px;background:rgba(4,10,28,.8);clip-path:var(--slant)}
.card:nth-child(2){width:94%}.card:nth-child(3){width:88%}
.card-k{font:800 italic 19px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.card-v{font:800 italic 19px/1 var(--display);color:var(--cyan);text-transform:uppercase;letter-spacing:.06em}
.card-meta{grid-column:1/-1;font:500 13px/1.3 var(--body);color:var(--muted)}
.segs{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:5px}
.segs i{height:8px;background:rgba(214,247,255,.16);transform:skewX(-24deg)}
.segs i.on{background:var(--cyan)}
@media (max-height:800px) and (min-width:901px){.card-meta{display:none}}

.keys{position:fixed;left:24px;bottom:16px;z-index:20;display:flex;gap:18px;padding:8px 22px 8px 12px;background:rgba(4,10,28,.88);clip-path:var(--slant);font:800 italic 14px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--ice);pointer-events:none;margin:0}
.keys kbd{display:inline-block;font:inherit;background:#fff;color:var(--ink);padding:4px 10px 3px;margin-right:7px;clip-path:var(--slant);letter-spacing:.04em}
@media (hover:none){.keys{display:none}}

/* ---------- inner screens ---------- */
.inner{padding:150px 4vw 84px;display:flex;flex-direction:column;gap:22px}
/* Never let the column squeeze a block: a squeezed scroller (the year row) scrolls inside itself and cuts its cards. */
.inner>*{flex-shrink:0}
.head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;animation:rise .45s var(--out) both}
.head h2{margin:0;font:900 italic clamp(60px,min(8vw,13vh),124px)/.82 var(--display);text-transform:uppercase;transform:rotate(-4deg);transform-origin:0 100%;text-shadow:7px 7px 0 var(--blue)}
.head .sub{font:800 italic 17px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;background:var(--cyan);color:var(--ink);padding:7px 20px 6px;clip-path:var(--slant);margin:0 0 12px}
.head .count{font:700 italic 16px/1 var(--display);letter-spacing:.18em;color:var(--muted);margin:0 0 16px;text-transform:uppercase}
.head .back{margin:0 0 12px auto}

.tabs{display:flex;flex-wrap:wrap;gap:6px}
.qgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:start}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 400px);overflow-y:auto}
.qrow{all:unset;box-sizing:border-box;cursor:pointer;width:calc(100% - 18px);display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 22px 9px 18px;background:rgba(4,10,28,.62);clip-path:polygon(2% 0,100% 0,98% 100%,0 100%);transition:transform .2s var(--snap),background .12s}
.qrow:hover{background:rgba(23,73,209,.6)}
.qn{font:800 italic 20px/1 var(--display);color:var(--cyan)}
.qtitle{display:flex;flex-direction:column;gap:4px;min-width:0}
.qt{font:800 italic 24px/1 var(--display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qd{font:600 12px/1.2 var(--body);color:var(--muted);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow[aria-current="true"]{background:var(--cyan);color:var(--ink);transform:translateX(16px)}
.qrow[aria-current="true"] .qn,.qrow[aria-current="true"] .qd{color:var(--ink)}
.qrow:focus-visible .qt{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.st{font:800 italic 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:5px 9px 4px;white-space:nowrap;background:rgba(214,247,255,.14);color:var(--ice)}
.st.live{background:#fff;color:var(--ink)}
.st.progress{background:var(--blue);color:#fff}
.st.prize{background:var(--amber);color:var(--ink)}
.st.dropped{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px rgba(169,190,234,.55)}
.qrow[aria-current="true"] .st{background:var(--ink);color:#fff;box-shadow:none}
.qrow[aria-current="true"] .st.prize{background:var(--amber);color:var(--ink)}

.qdetail{position:relative;background:rgba(4,10,28,.84);padding:26px 34px 30px;clip-path:polygon(0 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%);max-height:calc(100vh - 400px);overflow-y:auto;animation:pop .35s var(--snap) both}
@keyframes pop{from{opacity:0;translate:24px 0}to{opacity:1;translate:0 0}}
.kind{margin:0;font:800 italic 14px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.qdetail h3{margin:8px 0 16px;font:900 italic clamp(40px,4.2vw,62px)/.9 var(--display);text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:10px 30px;margin:0}
.meta div{display:flex;flex-direction:column;gap:5px}
.meta dt{font:800 italic 12px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:0;font:700 italic 19px/1.1 var(--display)}
.obj{font:500 17px/1.5 var(--body);color:var(--ice);margin:18px 0 0;max-width:62ch}
.h{margin:22px 0 10px;font:800 italic 14px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.results li{position:relative;padding-left:22px;font:500 16px/1.45 var(--body)}
.results li::before{content:"";position:absolute;left:0;top:.5em;width:11px;height:7px;background:var(--cyan);transform:skewX(-24deg)}
.results b{color:var(--cyan);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:600 13px/1 var(--body);padding:6px 10px;background:rgba(214,247,255,.1);color:var(--ice)}
.proof{display:flex;flex-wrap:wrap;gap:8px}
.proof a{display:inline-block;text-decoration:none;font:800 italic 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:10px 20px 9px;background:#fff;color:var(--ink);clip-path:var(--slant)}
.proof a:hover{background:var(--cyan)}
.proof a:focus-visible{text-decoration:underline}

.legend{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin:0}
.legend p{flex-basis:100%;margin:0;font:500 15px/1.4 var(--body);color:var(--muted)}
.lg{display:flex;align-items:center;gap:8px;font:800 italic 13px/1 var(--display);letter-spacing:.16em;text-transform:uppercase}
.lg small{font:500 13px/1 var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.pips{display:inline-flex;gap:3px}
.pips i{width:15px;height:9px;background:rgba(214,247,255,.16);transform:skewX(-24deg)}
.pips i.on{background:var(--cyan)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sgroup{background:rgba(4,10,28,.74);padding:18px 22px 18px;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%);animation:pop .4s var(--snap) both;animation-delay:calc(var(--i) * 50ms)}
.sgroup h3{margin:0 0 8px;font:900 italic 28px/1 var(--display);text-transform:uppercase;display:flex;gap:10px;align-items:baseline}
.sgroup h3 small{font:800 italic 14px/1 var(--display);color:var(--cyan);letter-spacing:.1em}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto 82px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(214,247,255,.08);font:600 15px/1.25 var(--body)}
.skill .rk{font:800 italic 11px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right}

.log{display:flex;flex-direction:column;gap:14px;max-width:1100px}
.entry{display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;background:rgba(4,10,28,.74);padding:20px 30px;clip-path:polygon(1.2% 0,100% 0,98.8% 100%,0 100%);animation:pop .4s var(--snap) both;animation-delay:calc(var(--i) * 60ms)}
.entry .when{font:900 italic 26px/1 var(--display);color:var(--cyan);text-transform:uppercase}
.entry .when small{display:block;margin-top:8px;font:700 italic 14px/1.3 var(--display);letter-spacing:.12em;color:var(--muted)}
.entry h3{margin:0;font:900 italic 32px/1 var(--display);text-transform:uppercase}
.entry .org{font:700 italic 17px/1.25 var(--display);letter-spacing:.08em;color:var(--ice);margin:5px 0 10px;text-transform:uppercase}

/* The native scrollbar is a white Windows bar under a blue screen, so it is hidden and #cRail
   draws one in the site's style. Snapping is for fingers only: on a desktop it pulled wheel and
   rail scrolls back to the card they started from. */
.years{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
@media (pointer:coarse){.years{scroll-snap-type:x proximity}}
.rail{position:relative;height:22px;margin-top:10px;cursor:pointer;touch-action:none}
.rail[hidden]{display:none}
.rail::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;background:rgba(214,247,255,.14);clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.rail span{position:absolute;left:0;top:5px;height:12px;background:var(--cyan);clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:background .15s}
.rail:hover span,.rail.drag span{background:#fff}
.year{flex:0 0 290px;scroll-snap-align:start;background:rgba(4,10,28,.7);padding:16px 18px 18px;clip-path:polygon(0 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%);animation:fadein .4s ease-out both;animation-delay:calc(var(--i) * 50ms)}
/* Year cards fade rather than slide: they sit in a snapping scroller, and a card that is still
   moving when the screen opens gets snapped to mid-slide, leaving the row 24px scrolled. */
@keyframes fadein{from{opacity:0}to{opacity:1}}
.year h3{margin:0 0 10px;font:900 italic 64px/.85 var(--display);color:transparent;-webkit-text-stroke:2px var(--cyan)}
.year.now h3{color:var(--cyan);-webkit-text-stroke:0}

.sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;max-width:1200px}
.panel h3{margin:0 0 12px;font:900 italic 28px/1 var(--display);text-transform:uppercase}
.bigl{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;padding:14px 24px 12px;background:rgba(214,247,255,.08);clip-path:var(--slant);margin-top:8px;transition:background .12s,color .12s}
.bigl strong{font:800 italic 22px/1 var(--display);text-transform:uppercase}
.bigl span{font:600 14px/1.2 var(--body);color:var(--muted);text-align:right;overflow-wrap:anywhere}

.setrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.setrow .lbl{flex-basis:100%;font:800 italic 13px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-top:6px}

/* ---------- screen wipe ---------- */
.wipe{position:fixed;inset:0;z-index:60;pointer-events:none;visibility:hidden}
.wipe::before,.wipe::after{content:"";position:absolute;inset:0;clip-path:polygon(120% 0,140% 0,120% 100%,100% 100%)}
.wipe::before{background:#fff}
.wipe::after{background:var(--cyan)}
.wipe.in,.wipe.out{visibility:visible}
.wipe.in::before{animation:wipeIn .24s var(--out) forwards}
.wipe.in::after{animation:wipeIn .26s .06s var(--out) forwards}
.wipe.out::before,.wipe.out::after{clip-path:polygon(-40% 0,140% 0,120% 100%,-60% 100%);animation:wipeOut .3s var(--out) forwards}
.wipe.out::before{animation-delay:.06s}
@keyframes wipeIn{from{clip-path:polygon(120% 0,140% 0,120% 100%,100% 100%)}to{clip-path:polygon(-40% 0,140% 0,120% 100%,-60% 100%)}}
@keyframes wipeOut{from{clip-path:polygon(-40% 0,140% 0,120% 100%,-60% 100%)}to{clip-path:polygon(-40% 0,-20% 0,-40% 100%,-60% 100%)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const pips = (n) => Array.from({ length: 4 }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("");
const calm = () => document.documentElement.classList.contains("calm") || matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- static text ---------- */
function applyStatic() {
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-th]").forEach((el) => { el.innerHTML = t(el.dataset.th); });
  document.querySelectorAll("[data-ta]").forEach((el) => {
    const [attr, key] = el.dataset.ta.split(":"); el.setAttribute(attr, t(key));
  });
  ["quests", "stats", "log", "calendar", "profile", "system"].forEach((id, i) => {
    const [label, sub] = menuText(MENU[i]);
    const h = document.querySelector(`#${id} .head h2`); if (h) h.textContent = label;
    const s = document.querySelector(`#${id} .head .sub`); if (s && id !== "calendar" && id !== "system") s.textContent = sub;
  });
  $("#about").innerHTML = t("about").map((p) => `<p>${p}</p>`).join("");
  $("#facts").innerHTML = t("facts").map(([dt, ...dds]) =>
    `<div><dt>${dt}</dt>${dds.map(([main, note]) => `<dd>${main}<span>${note}</span></dd>`).join("")}</div>`).join("");
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

/* ---------- clock ---------- */
function clock() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  $("#cDate").textContent = fr() ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}` : `${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
  $("#cDow").textContent = d.toLocaleDateString(lang, { weekday: "short" }).replace(".", "").toUpperCase();
  const h = d.getHours();
  $("#cTod").textContent = t("tod")[h < 5 ? 0 : h < 11 ? 1 : h < 17 ? 2 : h < 21 ? 3 : 4];
  const start = new Date(2026, 5, 3);
  const today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = Math.round((today - start) / 86400000) + 1;
  $("#cDay").textContent = day > 0 ? t("dayOf")(day) : "";
}

/* ---------- main menu ---------- */
const menuList = $("#menuList");
menuList.innerHTML = MENU.map((m, i) =>
  `<li style="--i:${i}"><button type="button" data-i="${i}"><span class="label"></span><span class="sub"></span></button></li>`).join("");
const items = [...menuList.children];
const btns = items.map((li) => li.querySelector("button"));
function renderMenu() {
  btns.forEach((b, i) => {
    const [label, sub] = menuText(MENU[i]);
    b.querySelector(".label").textContent = label;
    b.querySelector(".sub").textContent = sub;
  });
}
let sel = 0;
function select(i, focus) {
  sel = (i + MENU.length) % MENU.length;
  items.forEach((li, j) => li.classList.toggle("sel", j === sel));
  if (focus) btns[sel].focus({ preventScroll: true });
}
btns.forEach((b, i) => {
  b.addEventListener("mouseenter", () => select(i));
  b.addEventListener("focus", () => select(i));
  b.addEventListener("click", () => go(MENU[i].id));
});
select(0);

function renderStatus() {
  const list = fr() ? STATUS.map((s, i) => ({ ...s, ...FR.status[i] })) : STATUS;
  $("#status").innerHTML = list.map((s) =>
    `<div class="card"><span class="card-k">${s.k}</span><span class="card-v">${s.v}</span>` +
    (s.segs ? `<span class="segs" aria-label="${s.segs[1]} ${t("of")} ${s.segs[0]}">${Array.from({ length: s.segs[0] }, (_, i) => `<i class="${i < s.segs[1] ? "on" : ""}"></i>`).join("")}</span>` : "") +
    `<span class="card-meta">${s.meta}</span></div>`).join("");
}

/* ---------- quests ---------- */
let tab = "all";
let qsel = "kalori";
const visible = () => QUESTS.filter((q) => tab === "all" || q.cats.includes(tab));
function renderTabs() {
  $("#qTabs").innerHTML = TABS.map(([id, l]) =>
    `<button class="chipbtn" role="tab" type="button" aria-selected="${id === tab}" data-tab="${id}">${fr() ? FR.tabs[id] : l}</button>`).join("");
}
function renderList() {
  const v = visible();
  if (!v.some((q) => q.id === qsel)) qsel = v[0].id;
  $("#qList").innerHTML = v.map((raw, i) => {
    const q = quest(raw);
    return `<li><button class="qrow" type="button" data-q="${q.id}" aria-current="${q.id === qsel}">` +
      `<span class="qn">${String(i + 1).padStart(2, "0")}</span>` +
      `<span class="qtitle"><span class="qt">${q.title}</span><span class="qd">${q.when} · ${q.role}</span></span>` +
      `<span class="st ${q.status}">${q.statusLabel}</span></button></li>`;
  }).join("");
  $("#qCount").textContent = `${v.length} ${t("of")} ${QUESTS.length}`;
}
function renderDetail() {
  const q = quest(QUESTS.find((x) => x.id === qsel));
  // Only links that exist are shown; a card with none simply has no Proof row.
  const links = q.proof.filter((p) => p.href);
  const proof = links.length
    ? `<p class="h">${t("proof")}</p><div class="proof">${links.map((p) => `<a href="${p.href}" target="_blank" rel="noopener">${p.label} ↗</a>`).join("")}</div>`
    : "";
  const el = $("#qDetail");
  el.innerHTML =
    `<p class="kind">${q.kind}</p><h3>${q.title}</h3>` +
    `<dl class="meta"><div><dt>${t("role")}</dt><dd>${q.role}</dd></div><div><dt>${t("team")}</dt><dd>${q.team}</dd></div>` +
    `<div><dt>${t("when")}</dt><dd>${q.when}</dd></div><div><dt>${t("status")}</dt><dd>${q.statusLabel}</dd></div></dl>` +
    `<p class="obj">${q.obj}</p>` +
    `<p class="h">${t("results")}</p><ul class="results">${q.results.map((r) => `<li>${r}</li>`).join("")}</ul>` +
    `<p class="h">${t("stack")}</p><div class="tags">${q.stack.map((s) => `<span>${s}</span>`).join("")}</div>` +
    proof;
  el.style.animation = "none"; void el.offsetHeight; el.style.animation = "";
  el.scrollTop = 0;
}
function pickQuest(id, focus) {
  qsel = id;
  document.querySelectorAll(".qrow").forEach((b) => b.setAttribute("aria-current", String(b.dataset.q === id)));
  renderDetail();
  if (focus) document.querySelector(`.qrow[data-q="${id}"]`).focus();
}
function setTab(id) {
  tab = id; renderTabs(); renderList(); renderDetail();
  const tb = document.querySelector(`[data-tab="${id}"]`); if (tb) tb.focus();
}
$("#qTabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
$("#qList").addEventListener("click", (e) => {
  const b = e.target.closest(".qrow"); if (!b) return;
  pickQuest(b.dataset.q);
  if (matchMedia("(max-width: 900px)").matches) $("#qDetail").scrollIntoView({ behavior: calm() ? "auto" : "smooth", block: "start" });
});

/* ---------- stats ---------- */
function renderStats() {
  $("#sLegend").innerHTML =
    `<p>${t("legend")}</p>` +
    Object.keys(RANKS).map((k) => { const r = rank(k); return `<span class="lg"><span class="pips">${pips(r.n)}</span>${r.l} <small>${r.d}</small></span>`; }).join("");
  $("#sGrid").innerHTML = SKILLS.map((g, gi) =>
    `<section class="sgroup" style="--i:${gi}"><h3><small>${String(gi + 1).padStart(2, "0")}</small>${fr() ? FR.skillGroups[gi] : g.g}</h3>` +
    g.items.map(([name, r]) => `<div class="skill"><span>${(fr() && FR.skillNames[name]) || name}</span><span class="pips" aria-hidden="true">${pips(RANKS[r].n)}</span><span class="rk">${rank(r).l}</span></div>`).join("") +
    `</section>`).join("");
}

/* ---------- log ---------- */
function renderLog() {
  $("#lList").innerHTML = LOG.map((raw, i) => {
    const e = logEntry(raw, i);
    return `<article class="entry" style="--i:${i}"><div class="when">${e.when}<small>${e.dur}</small></div>` +
      `<div><h3>${e.title}</h3><p class="org">${e.org}</p><ul class="results">${e.points.map((p) => `<li>${p}</li>`).join("")}</ul></div></article>`;
  }).join("");
}

/* ---------- calendar ---------- */
function renderCal() {
  $("#cYears").innerHTML = CAL.map((y, i) =>
    `<section class="year${y.now ? " now" : ""}" style="--i:${i}"><h3>${y.y}</h3>` +
    calEvents(y).map(([m, tx]) => `<div class="ev"><span class="m">${m}</span><span>${tx}</span></div>`).join("") + `</section>`).join("");
  paintRail();
}

/* ---------- calendar rail: the row's scrollbar, drawn by the page ---------- */
const years = $("#cYears"), rail = $("#cRail"), thumb = rail.firstElementChild;
const railMax = () => years.scrollWidth - years.clientWidth;
function paintRail() {
  const max = railMax();
  rail.hidden = max <= 1;
  if (rail.hidden) return;
  const w = rail.clientWidth, tw = Math.max(years.clientWidth / years.scrollWidth, 0.08) * w;
  thumb.style.width = `${tw}px`;
  thumb.style.transform = `translateX(${(years.scrollLeft / max) * (w - tw)}px)`;
}
years.addEventListener("scroll", paintRail, { passive: true });
new ResizeObserver(paintRail).observe(years);   // also fires when the screen goes from hidden to shown
rail.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const r = rail.getBoundingClientRect(), tw = thumb.offsetWidth, max = railMax();
  // Grabbing the thumb keeps it under the finger; clicking the track centres it there.
  const grab = e.target === thumb ? e.clientX - thumb.getBoundingClientRect().left : tw / 2;
  const to = (x) => { years.scrollLeft = ((x - r.left - grab) / (r.width - tw)) * max; };
  to(e.clientX);
  rail.setPointerCapture(e.pointerId);
  rail.classList.add("drag");
  const move = (ev) => to(ev.clientX);
  const up = () => {
    rail.classList.remove("drag");
    rail.removeEventListener("pointermove", move);
    rail.removeEventListener("pointerup", up);
    rail.removeEventListener("pointercancel", up);
  };
  rail.addEventListener("pointermove", move);
  rail.addEventListener("pointerup", up);
  rail.addEventListener("pointercancel", up);
});
// A mouse wheel scrolls the row sideways; at either end it hands back to the page.
years.addEventListener("wheel", (e) => {
  if (e.ctrlKey || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;   // trackpads already swipe sideways
  const d = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY, max = railMax();
  if (max <= 1 || (d < 0 && years.scrollLeft <= 0) || (d > 0 && years.scrollLeft >= max - 1)) return;
  e.preventDefault();
  years.scrollLeft += d;
}, { passive: false });
function stepYears(dir) {
  const card = years.firstElementChild;
  if (card) years.scrollBy({ left: dir * (card.offsetWidth + 16), behavior: calm() ? "auto" : "smooth" });
}

/* ---------- motion setting ---------- */
function setMotion(isCalm) {
  document.documentElement.classList.toggle("calm", isCalm);
  $("#motionFull").setAttribute("aria-pressed", String(!isCalm));
  $("#motionCalm").setAttribute("aria-pressed", String(isCalm));
}
$("#motionFull").addEventListener("click", () => setMotion(false));
$("#motionCalm").addEventListener("click", () => setMotion(true));

/* ---------- music ----------
   The track is audio/bgm.mp3; audio/README.md says how to add or change it.
   The speaker only appears once that file is really there, so a site without
   a track shows no button that plays nothing. MUSIC_FILE = null switches it off.
   Off until the visitor turns it on: browsers refuse sound before a click anyway.
   START_ON = true shows the speaker as on and starts the track on the first
   click or key press anywhere; the toggle still turns it off.
   VOLUME runs from 0 to 1; FADE_MS is the fade in and out. */
const MUSIC_FILE = "audio/bgm.mp3";
const START_ON = false;
const VOLUME = 0.01, FADE_MS = 1200;
const bgm = $("#bgm"), sound = $("#sound");
let musicOn = false, fadeId = 0;
// A timer, not requestAnimationFrame: audio has to fade whether or not the page is painting.
function fadeTo(target, done) {
  clearInterval(fadeId);
  const from = bgm.volume, t0 = performance.now();
  fadeId = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / FADE_MS);
    bgm.volume = from + (target - from) * k;
    if (k === 1) { clearInterval(fadeId); if (done) done(); }
  }, 40);
}
function paintSound(on) {
  sound.setAttribute("aria-pressed", String(on));
  sound.title = on ? t("musicOn") : t("musicOff");
}
async function setMusic(on) {
  musicOn = on;
  paintSound(on);
  if (!on) { fadeTo(0, () => bgm.pause()); return; }
  if (bgm.paused) bgm.volume = 0;
  try { await bgm.play(); } catch { if (musicOn) { musicOn = false; paintSound(false); } return; }
  if (musicOn) fadeTo(VOLUME); else bgm.pause();
}
if (MUSIC_FILE) {
  const showSound = () => { if (sound.hidden) { sound.hidden = false; paintSound(musicOn); } };
  // Two ways to learn the track exists: a HEAD request on a real server (Cloudflare answers a
  // missing file with the page itself, so the type has to say audio), and the audio element's
  // own metadata for a page opened from disk, where fetch is not allowed.
  fetch(MUSIC_FILE, { method: "HEAD", cache: "no-cache" })
    .then((r) => { if (r.ok && /^audio\//.test(r.headers.get("content-type") || "")) showSound(); })
    .catch(() => {});
  bgm.addEventListener("loadedmetadata", showSound, { once: true });
  bgm.preload = "metadata";
  bgm.src = MUSIC_FILE;
  paintSound(false);
  sound.addEventListener("click", () => setMusic(!musicOn));
  bgm.addEventListener("error", () => { musicOn = false; paintSound(false); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) bgm.pause();
    else if (musicOn) bgm.play().catch(() => {});
  });
  if (START_ON) {
    musicOn = true; paintSound(true);
    const first = (e) => {
      removeEventListener("pointerdown", first); removeEventListener("keydown", first);
      if (musicOn && !e.target.closest("#sound")) setMusic(true);
    };
    addEventListener("pointerdown", first); addEventListener("keydown", first);
  }
}

/* ---------- render everything in the current language ---------- */
function renderAll() {
  document.documentElement.lang = lang;
  applyStatic(); clock(); renderMenu(); renderStatus();
  renderTabs(); renderList(); renderDetail();
  renderStats(); renderLog(); renderCal();
  $("#wm").textContent = wmText(current);
  if (MUSIC_FILE) paintSound(musicOn);
}
function setLang(l) {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch {}
  renderAll();
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });

/* ---------- navigation ---------- */
let current = "menu";
let busy = false;
const wipe = $("#wipe");
function show(id) {
  document.querySelectorAll(".screen").forEach((s) => { s.hidden = s.id !== id; });
  current = id;
  $("#wm").textContent = wmText(id);
  if (id === "menu") select(sel, true);
  else if (id === "quests") { const r = document.querySelector('.qrow[aria-current="true"]'); if (r) r.focus({ preventScroll: true }); }
  else { const b = document.querySelector(`#${id} .back`); if (b) b.focus({ preventScroll: true }); }
}
/* History: the menu is home. Opening a screen from the menu adds one history
   step, so the browser's Back returns to the menu; moving between screens
   replaces that step; going back to the menu (Esc, Back) steps history back,
   so the next browser Back leaves the site instead of reopening the screen. */
const PAGE = () => location.pathname + location.search;
let pending = null;
function transition(id) {
  // Mid-wipe, "current" is still the old screen, so remember the request and settle it after.
  if (busy) { pending = id; return; }
  if (id === current) return;
  if (calm()) { show(id); return; }
  busy = true;
  wipe.className = "wipe in";
  setTimeout(() => {
    show(id);
    wipe.className = "wipe out";
    setTimeout(() => {
      wipe.className = "wipe"; busy = false;
      const next = pending; pending = null;
      if (next && next !== current) transition(next);
    }, 380);
  }, 330);
}
function go(id) {
  if (busy || id === current || !WATERMARK[id]) return;
  if (id === "menu") {
    if (history.state && history.state.screen) { history.back(); return; }   // popstate paints the menu
    history.replaceState(null, "", PAGE());
  } else if (current === "menu") {
    history.pushState({ screen: id }, "", `#${id}`);
  } else {
    history.replaceState({ screen: id }, "", `#${id}`);
  }
  transition(id);
}
const screenFromUrl = () => { const h = location.hash.slice(1); return WATERMARK[h] && h !== "menu" ? h : "menu"; };
addEventListener("popstate", () => transition(screenFromUrl()));
document.addEventListener("click", (e) => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); });
document.addEventListener("keydown", (e) => {
  if (busy || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (current === "menu") {
    if (k === "ArrowDown") { e.preventDefault(); select(sel + 1, true); }
    else if (k === "ArrowUp") { e.preventDefault(); select(sel - 1, true); }
    else if (k === "Enter" && !e.target.closest("button, a")) { e.preventDefault(); go(MENU[sel].id); }
    return;
  }
  if (k === "Escape" || k === "Backspace") { e.preventDefault(); go("menu"); return; }
  if (current === "calendar" && (k === "ArrowRight" || k === "ArrowLeft")) { e.preventDefault(); stepYears(k === "ArrowRight" ? 1 : -1); return; }
  if (current === "quests") {
    const v = visible();
    const idx = v.findIndex((q) => q.id === qsel);
    if (k === "ArrowDown") { e.preventDefault(); pickQuest(v[Math.min(idx + 1, v.length - 1)].id, true); }
    else if (k === "ArrowUp") { e.preventDefault(); pickQuest(v[Math.max(idx - 1, 0)].id, true); }
    else if (k === "ArrowRight" || k === "ArrowLeft") {
      e.preventDefault();
      const ti = TABS.findIndex((x) => x[0] === tab);
      setTab(TABS[(ti + (k === "ArrowRight" ? 1 : -1) + TABS.length) % TABS.length][0]);
    }
  }
});
renderAll();
{
  // A link straight to a screen (…/#calendar) gets the menu slipped in underneath,
  // so Back still lands on the menu. A reload keeps the steps it already has.
  const start = screenFromUrl();
  if (start === "menu") history.replaceState(null, "", PAGE());
  else if (!(history.state && history.state.screen === start)) {
    history.replaceState(null, "", PAGE());
    history.pushState({ screen: start }, "", `#${start}`);
  }
  show(start);
}
</script>
